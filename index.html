<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joshua Co · AI Enthusiast & Web Developer</title>
    <meta
      name="description"
      content="Joshua Co is an IT student, AI enthusiast and web developer from Dagupan City, Philippines, and the maker of Clak, a free typing test with mechanical keyboard sounds."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Joshua Co · AI Enthusiast & Web Developer" />
    <meta
      property="og:description"
      content="Practical, AI-powered software with interfaces that feel effortless."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // uiarc components theme off data-theme; mirror the system setting.
      ;(() => {
        const mq = matchMedia('(prefers-color-scheme: dark)')
        const set = () =>
          (document.documentElement.dataset.theme = mq.matches ? 'dark' : 'light')
        set()
        mq.addEventListener('change', set)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
